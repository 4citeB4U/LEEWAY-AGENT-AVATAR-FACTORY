name: Deploy LeeWay Avatar Factory Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expand governed source package
        run: unzip -q release/LEEWAY-AGENT-AVATAR-FACTORY.zip -d buildpkg
      - name: Verify static and fail-closed contracts
        run: node buildpkg/tests/static-check.mjs
      - name: Publish source evidence
        uses: actions/upload-artifact@v4
        with:
          name: leeway-avatar-factory-build-evidence
          path: buildpkg/BUILD-EVIDENCE.json
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand governed source package
        run: unzip -q release/LEEWAY-AGENT-AVATAR-FACTORY.zip -d buildpkg
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: buildpkg/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
